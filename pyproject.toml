[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hospital-admissions-forecast"
version = "0.1.0"
description = "Monthly SUS hospital admissions by state: rolling-origin backtest against a seasonal naive, calibrated 80% bands."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Rodrigo Hermont Ozon" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "statsmodels>=0.14",
    "python-dateutil>=2.8",
    "joblib>=1.3",
    "matplotlib>=3.8",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["admissions"]

[tool.pytest.ini_options]
testpaths = ["tests"]
