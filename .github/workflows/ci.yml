name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -v
      - name: Backtest smoke run on two states from the committed data
        run: python -m admissions.cli backtest --states PR SP --first 2025-07-01 --last 2025-09-01
